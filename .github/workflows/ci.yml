name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
        env:
          CI: true

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --no-daemon
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build & publish release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [analyze-test, build-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleRelease --no-daemon
        env:
          CI: true
      - name: Rename APK for release
        run: |
          mkdir -p app/build/outputs/apk/release/dist
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/dist/SimpleFin-${GITHUB_REF_NAME}.apk"
      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/dist/SimpleFin-*.apk
