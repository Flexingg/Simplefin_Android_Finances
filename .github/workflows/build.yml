name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-v1.3.0}"
          cp app/build/outputs/apk/release/app-release.apk "dist/SimpleFin-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/app-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/app-debug.apk"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SimpleFin-APKs
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'v1.3.2 - Full Google Cloud Sync & Insights Tab Symbols Fix' }}
          body: |
            ## 🚀 Version 1.3.2 Release

            ### ✨ Key Improvements & Fixes:
            - **☁️ Full Google Account Cloud Backup & Sync**:
              - Signing in with Google now automatically restores and persists everything:
                - **SimpleFIN link** (access URL and connection state)
                - **Transactions** (auto-synced with Room local database)
                - **Budgets** (category targets and rollovers)
                - **Categorization Rules** (patterns, priority ordering, matches)
                - **Custom Categories & Income Category**
                - **Discretionary Spending Setpoint & Preferences**
                - **Gemini AI Configuration & API Keys**
              - Automatic background sync on login / startup, plus a dedicated **"Sync Now"** button under the Google Account card in Settings.
            - **🎨 Insights Tab Symbols & Formatting Fix**: Clean Material design icons and typography for Trends, Heatmap, Net Worth, and Retirement tabs, eliminating corrupted symbol rendering.
            - **📱 Downloadable APK**:
              Download **`SimpleFin-v1.3.2.apk`** below (signed with official release certificate matching Firebase Google Sign-In) to update directly!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
