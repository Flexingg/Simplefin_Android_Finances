name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'v1.3.0 - AI Chat Advisor & Retirement Calculator' }}
          body: |
            ## 🚀 Version 1.3.0 Release

            ### ✨ New Major Features:
            - **🤖 In-App AI Chat Advisor (MCP Capabilities)**: Full conversational advisor powered by Gemini 2.5/3.7 with custom Gemini API Key & Vertex AI options, function calling, batch categorization review, and instant tool execution.
            - **🏖️ Retirement & FIRE Projection Calculator**: Interactive projection tab in Insights with real compounding (Fisher equation), Target FIRE number calculation, Coast FIRE milestone detection, surplus/shortfall alerts, Canvas area growth chart, and parameter sliders.

            ### 📱 Downloadable APK:
            Download `app-debug.apk` below and install directly on your Android device!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
