name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-v1.3.0}"
          cp app/build/outputs/apk/release/app-release.apk "dist/SimpleFin-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/app-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/app-debug.apk"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SimpleFin-APKs
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'v1.3.1 - AI Chat Advisor & Retirement Calculator' }}
          body: |
            ## 🚀 Version 1.3.1 Release

            ### ✨ New Major Features:
            - **🤖 In-App AI Chat Advisor (MCP Capabilities)**: Full conversational advisor powered by Gemini 2.5/3.7 with custom Gemini API Key & Vertex AI options, function calling, batch categorization review, and instant tool execution. Accessible via the new **floating action button** or the Quick Actions card on the Home screen.
            - **🏖️ Retirement & FIRE Projection Calculator**: Interactive projection tab in Insights with real compounding (Fisher equation), Target FIRE number calculation, Coast FIRE milestone detection, surplus/shortfall alerts, Canvas area growth chart, and parameter sliders. Accessible from Insights or directly from Home Quick Actions.
            - **⚙️ Gemini Configuration**: Located prominently near the top of the Settings screen.

            ### 📱 Downloadable APK:
            Download **`SimpleFin-v1.3.1.apk`** below (signed with the official release certificate matching Firebase Google Sign-In) to install or update without uninstalling!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
