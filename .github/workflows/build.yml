name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-v1.3.0}"
          cp app/build/outputs/apk/release/app-release.apk "dist/SimpleFin-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/app-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/app-debug.apk"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SimpleFin-APKs
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.3' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'v1.3.3 - Fix Firestore @DocumentId Deserialization' }}
          body: |
            ## 🚀 Version 1.3.3 Release

            ### 🐛 Hotfix:
            - **Fixed Firestore Deserialization Error on Cloud Sync**:
              - Removed conflicting `@DocumentId` annotations from `RuleEntity`, `BudgetEntity`, `GoalEntity`, and `TransactionEntity` that threw `'id' was found from document, cannot apply @DocumentId on this property`.
              - Added resilient per-document `runCatching` parsing and explicit document ID fallback across all synchronization pathways.
              - Cloud sync now completes smoothly for all existing rules, budgets, goals, and transactions.

            ### 📱 Downloadable APK:
            Download **`SimpleFin-v1.3.3.apk`** below to update directly!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
