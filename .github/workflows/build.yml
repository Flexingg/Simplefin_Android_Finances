name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-v1.3.0}"
          cp app/build/outputs/apk/release/app-release.apk "dist/SimpleFin-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/app-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/app-debug.apk"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SimpleFin-APKs
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.4' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'v1.3.4 - Selectable Gemini Models with 3.8 Flash Default' }}
          body: |
            ## 🚀 Version 1.3.4 Release

            ### ✨ Features & Improvements:
            - **⚡ Selectable Gemini AI Models**:
              - Default model set to **Gemini 3.8 Flash** (`gemini-3.8-flash`).
              - Selectable in Settings and directly inside the AI Advisor dialog with quick chips (`gemini-3.8-flash`, `gemini-2.5-flash`, `gemini-2.5-pro`, `gemini-2.0-flash`, `gemini-1.5-flash`, `gemini-1.5-pro`).
              - Support for custom model IDs in both Settings and chat modal.
              - Model selection persists across app launches and synchronizes seamlessly with your Google Account cloud backup.
              - Real-time active model status badge displayed in the AI Advisor chat header.

            ### 📱 Downloadable APK:
            Download **`SimpleFin-v1.3.4.apk`** below to update directly!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
