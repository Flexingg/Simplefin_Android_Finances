name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-v1.3.0}"
          cp app/build/outputs/apk/release/app-release.apk "dist/SimpleFin-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/app-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/app-debug.apk"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SimpleFin-APKs
          path: dist/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.6' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'v1.3.6 - Fix Missing Thought Signature in Tool Calling' }}
          body: |
            ## 🚀 Version 1.3.6 Release

            ### 🐛 Hotfix:
            - **Fixed Missing `thought_signature` Error on Function Calls**:
              - Gemini 2.0 / 2.5 / 3.x Flash and Pro models include internal thought signatures and thinking metadata in candidate parts when executing tools.
              - `GeminiApiClient` now preserves the complete candidate `content` object returned by Gemini instead of reconstructing a stripped turn.
              - Supports parallel function calling with all responses merged into a unified user turn.
              - In-app AI chat advisor now executes financial calculations, transaction reviews, and retirement modeling with zero API schema errors.

            ### 📱 Downloadable APK:
            Download **`SimpleFin-v1.3.6.apk`** below to update directly!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
